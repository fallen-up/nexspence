name: Main image

# Publishes an image for every push to main, so a merged fix can be tested
# before the next release. Tags: `main` (moves with the branch) and the short
# commit SHA (fixed). `latest` stays on the last release: release.yml owns it.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**.md'

# One build at a time, and a running build is never cancelled. A newer push
# replaces a queued one, so `main` always ends on the newest commit.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nexspence/nexspence

jobs:
  image:
    # Forks have no RELEASE_PAT and no write access to this package.
    if: github.repository == 'nexspence/nexspence'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # git describe needs the release tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Describe version
        id: version
        # For example v2.12.1-3-g4d1d51e: the last release, the commits since
        # it, and the commit. The UI shows it next to the product name.
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Never `latest`: it must stay on the last release.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=
          labels: |
            org.opencontainers.image.source=https://github.com/nexspence/nexspence
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
